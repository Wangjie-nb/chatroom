# 熊出没聊天室 - Nginx 反向代理示例
# 用法：把 server_name 改成你的域名，然后
#   sudo cp 本文件 /etc/nginx/sites-enabled/chatroom
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d 你的域名   # 申请免费 HTTPS 证书（语音功能需要 HTTPS）

server {
    listen 80;
    server_name xcmwebsocket.xyz;          # ← 改成你的域名

    # 静态文件根目录：server 进程的工作目录下的 www/
    root /opt/chatroom/www;
    index chat.html;

    # WebSocket 长连接转发
    location /ws {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # 文件上传
    location /upload {
        proxy_pass http://127.0.0.1:8888/upload;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 50M;
    }

    # 登录/注册 API
    location /api/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
